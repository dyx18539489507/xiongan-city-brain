[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiongan-traffic-platform"
version = "0.1.0"
description = "Phase 1 road-vehicle-cloud cooperative traffic control and SUMO platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "paho-mqtt>=2.1,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "psutil>=6.1,<8",
  "pyproj>=3.7,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-networkx>=3.4",
  "types-psutil>=7.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
traffic-platform = "traffic_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: integration tests that cross module boundaries",
  "e2e: complete vertical-slice tests",
  "chaos: communication and failure-injection tests",
  "performance: non-regression performance smoke tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["traffic_platform"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["libsumo", "traci", "sumolib", "paho", "paho.*"]
ignore_missing_imports = true
